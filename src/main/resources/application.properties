# ---------------------------------------------------------------------------
# Profiles: a key prefixed %dev, %test or %prod applies to that profile only,
# an unprefixed key is the default for every profile that does not override it.
# mvn quarkus:dev activates dev, @QuarkusTest activates test, a packaged jar prod.
# ---------------------------------------------------------------------------

# Quarkus's default test port (8081) is often already taken on a developer machine,
# so tests use a dedicated fixed port instead.
%test.quarkus.http.test-port=8085

# --- Datasource -------------------------------------------------------------
# Only the database kind is unprefixed. No JDBC url is configured for dev and test on
# purpose: when the JDBC extension is present and no url is set, Dev Services starts a
# PostgreSQL container by itself and points the application at it.
quarkus.datasource.db-kind=postgresql
# Dev Services would otherwise pick the latest PostgreSQL image, pin the project's version.
quarkus.datasource.devservices.image-name=postgres:16

# The packaged application needs a real connection string, supplied by the environment
# (docker-compose.yml provides these variables).
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/quarkus_tutorial}
%prod.quarkus.datasource.username=${DB_USER:quarkus}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# --- Flyway and Hibernate ---------------------------------------------------
# Flyway migrations are the source of truth for the schema and run when the application starts.
quarkus.flyway.migrate-at-start=true
# Hibernate only maps entities to the existing schema and never creates or drops tables.
# Being explicit also stops Dev Services from switching it to drop-and-create.
quarkus.hibernate-orm.schema-management.strategy=none

# --- JWT (SmallRye JWT) -----------------------------------------------------
# The private key signs the tokens the application issues, the public key verifies incoming ones.
# The RSA pair under dev-keys/ is for development and tests ONLY. It lives outside src/ on
# purpose: anything under src/main/resources is packaged into the jar and the Docker image, and a
# publicly committed private key must never ship. Dev and test read it from the file system
# (relative to the project root); prod has no default and refuses to start without real keys.
%dev,test.mp.jwt.verify.publickey.location=file:dev-keys/publicKey.pem
%dev,test.smallrye.jwt.sign.key.location=file:dev-keys/privateKey.pem
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
mp.jwt.verify.issuer=https://api.example.com/quarkus-tutorial
smallrye.jwt.new-token.issuer=https://api.example.com/quarkus-tutorial
# Access token lifetime in seconds.
smallrye.jwt.new-token.lifespan=3600

# --- Bootstrap administrator (optional) -------------------------------------
# When both are set, an enabled user with the seeded ADMIN role is created at startup if absent.
# Dev only, with a clearly fake password; nothing for test or prod (set them explicitly if wanted).
%dev.app.bootstrap-admin.email=admin@dev.local
%dev.app.bootstrap-admin.password=dev-only-admin-password

# --- Cache (quarkus-cache, Caffeine) ----------------------------------------
# "product-cache" holds ProductResponse DTOs keyed by product id. Bounded in size and in age so a
# missed invalidation can never serve stale data for long and memory use stays predictable.
quarkus.cache.caffeine."product-cache".maximum-size=500
quarkus.cache.caffeine."product-cache".expire-after-write=10M

# --- Persistence units: blocking ORM and Hibernate Reactive side by side ----------
# A persistence unit is either blocking (JDBC) or reactive (Vert.x client), never both, so the
# reactive slice gets its own named unit. The default unit keeps every existing entity (package
# "entity"); the "reactive" unit only maps the read-only ReactiveOrder (package "reactive").
quarkus.hibernate-orm.packages=com.edgareldy.quarkustutorial.entity
quarkus.hibernate-orm."reactive".datasource=streaming
quarkus.hibernate-orm."reactive".packages=com.edgareldy.quarkustutorial.reactive
quarkus.hibernate-orm."reactive".schema-management.strategy=none

# The named unit needs its own reactive-only datasource (named "streaming"; not "reactive", which
# would collide with the reactive.* configuration group of the default datasource). It has no URL of
# its own: it reuses the default datasource's reactive connection. In dev and test Dev Services
# computes that connection for the default datasource (same container, already Flyway-migrated), so
# Dev Services must not start a second, empty database for the named one. Flyway keeps using the
# default JDBC datasource: it is the only schema owner.
quarkus.datasource."streaming".db-kind=postgresql
quarkus.datasource."streaming".jdbc=false
quarkus.datasource."streaming".devservices.enabled=false
quarkus.datasource."streaming".reactive.url=${quarkus.datasource.reactive.url}
quarkus.datasource."streaming".username=${quarkus.datasource.username}
quarkus.datasource."streaming".password=${quarkus.datasource.password}
# Packaged application: the reactive client wants a "postgresql://" URL, not the JDBC one, so it gets
# its own variable (docker-compose.yml provides it, same host and database as DB_URL).
%prod.quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://localhost:5432/quarkus_tutorial}
