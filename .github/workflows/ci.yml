name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # No "services: postgres" block on purpose. Quarkus Dev Services starts its own PostgreSQL
      # container through the Docker daemon already available on ubuntu-latest, exactly as it does
      # locally, so the tests need nothing provisioned by the workflow.
      - name: Build and test
        run: ./mvnw -B verify

  # Slower and independent of the test job: it compiles the application to a GraalVM native
  # executable, checks that Dockerfile.native builds, and measures JVM mode against native mode.
  native-build:
    runs-on: ubuntu-latest

    # The packaged application (not the tests) needs a real database, so this job does declare a
    # PostgreSQL service. Dev Services only exists in dev and test mode.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quarkus_tutorial
          POSTGRES_USER: quarkus
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quarkus -d quarkus_tutorial"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/quarkus_tutorial
      DB_USER: quarkus
      DB_PASSWORD: ci-only-password
      # The repository's development key pair, fine for a throwaway CI database.
      JWT_PUBLIC_KEY_LOCATION: ${{ github.workspace }}/dev-keys/publicKey.pem
      JWT_PRIVATE_KEY_LOCATION: ${{ github.workspace }}/dev-keys/privateKey.pem

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package the JVM application
        run: ./mvnw -B package -DskipTests

      # container-build compiles inside a Mandrel builder container, so no local GraalVM is needed.
      - name: Build the native executable
        run: ./mvnw -B package -Dnative -Dquarkus.native.container-build=true -DskipTests

      - name: Measure JVM mode against native mode
        run: |
          {
            echo "| Mode | Ready after (ms) | Reported startup (s) | RSS after load (MB) |"
            echo "|---|---|---|---|"
            scripts/measure-startup.sh jvm java -jar target/quarkus-app/quarkus-run.jar
            scripts/measure-startup.sh native target/*-runner
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l target/*-runner

      - name: Check that Dockerfile.native builds
        run: docker build -f Dockerfile.native -t quarkus-tutorial:native .
